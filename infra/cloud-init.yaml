#cloud-config

packages:
  - curl
  - jq
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - wget

users:
  - name: livy
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

write_files:
  - path: /home/livy/config.json
    permissions: '0640'
    owner: livy:livy
    content: |
      {
        "trustauthority_api_key": "${trustauthority_api_key}",
        "trustauthority_api_url": "https://api.trustauthority.intel.com"
      }

  - path: /opt/scripts/core.sh
    permissions: '0755'
    encoding: b64
    content: ${core_script_b64}
  
  - path: /opt/scripts/install.sh
    permissions: '0755'
    encoding: b64
    content: ${install_script_b64}
  
  - path: /opt/scripts/run.sh
    permissions: '0755'
    encoding: b64
    content: ${run_script_b64}
  
  - path: /opt/scripts/setup-https.sh
    permissions: '0755'
    encoding: b64
    content: ${https_script_b64}

runcmd:
  # Execute the four-phase setup
  - /opt/scripts/core.sh
  - /opt/scripts/install.sh
  - /opt/scripts/run.sh
  - /opt/scripts/setup-https.sh ${domain_name} admin@livylabs.xyz

final_message: |
  Infrastructure Ready!