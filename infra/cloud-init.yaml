#cloud-config

packages:
  - curl
  - jq
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - wget

users:
  - name: livy
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

runcmd:
  # Set permissions for TDX device access
  - chmod 666 /dev/tdx_guest
  
  # Install Rust and build dependencies
  - apt-get update
  - apt-get install -y libclang-dev pkg-config build-essential libssl-dev git curl
  
  # Install Rust as livy user
  - |
    sudo -u livy bash -c '
    curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    echo "✅ Rust installed for livy user"
    '
  
  # Create TLS Notary configuration directory
  - mkdir -p /home/livy/tls-notary-config
  - chown -R livy:livy /home/livy/tls-notary-config
  
  # Generate TLS Notary signing key
  - |
    sudo -u livy bash -c '
    cd /home/livy/tls-notary-config
    openssl genpkey -algorithm RSA -out notary-signing-key.pem -pass pass:
    echo "✅ TLS Notary signing key generated"
    '
  
  # Create TLS Notary configuration file
  - |
    sudo -u livy bash -c '
    cd /home/livy/tls-notary-config
    echo "[notary]" > config.toml
    echo "host = \"0.0.0.0\"" >> config.toml
    echo "port = 7047" >> config.toml
    echo "" >> config.toml
    echo "[notary.signing_key]" >> config.toml
    echo "path = \"./notary-signing-key.pem\"" >> config.toml
    echo "" >> config.toml
    echo "[notary.attestation]" >> config.toml
    echo "# Intel Trust Authority configuration will be added here" >> config.toml
    echo "✅ TLS Notary configuration created"
    '
  
  # Create Intel Trust Authority config with environment variable
  - |
    sudo -u livy bash -c '
    cd /home/livy
    echo "{" > config.json
    echo "  \"trustauthority_api_key\": \"${trustauthority_api_key}\"," >> config.json
    echo "  \"trustauthority_api_url\": \"https://api.trustauthority.intel.com\"" >> config.json
    echo "}" >> config.json
    echo "✅ Intel Trust Authority config created with environment variable"
    '
  
  # Install Intel Trust Authority CLI using official Intel script
  - |
    export PATH=/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:$PATH
    curl -sL https://raw.githubusercontent.com/intel/trustauthority-client-for-go/main/release/install-tdx-cli.sh | bash -
    echo "✅ Intel Trust Authority CLI installed using official Intel script"
  
  # Test Intel Trust Authority CLI installation
  - |
    export PATH=/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:$PATH
    if command -v trustauthority-cli >/dev/null 2>&1; then
      echo "✅ Intel Trust Authority CLI is available: $(trustauthority-cli version 2>&1 | head -1)"
    else
      echo "❌ Intel Trust Authority CLI installation failed"
    fi
  
  # Verify TDX is active in kernel
  - |
    sudo -u livy bash -c '
    echo "🔧 Checking TDX kernel support..."
    if sudo dmesg | grep -i "Memory Encryption Features active: TDX" >/dev/null; then
      echo "✅ TDX memory encryption active in kernel"
    else
      echo "❌ TDX memory encryption not active"
    fi
    '
  
  # Download and build TLS Notary server from source
  - |
    sudo -u livy bash -c '
    cd /home/livy
    mkdir -p src
    cd src
    git clone https://github.com/tlsnotary/tlsn.git
    cd tlsn
    # Use latest stable version (adjust as needed)
    git checkout tags/v0.1.0 || git checkout main
    echo "✅ TLS Notary source code downloaded"
    '
  
  # Build TLS Notary server
  - |
    sudo -u livy bash -c '
    cd /home/livy/src/tlsn
    export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/home/livy/.cargo/bin:$PATH"
    export CARGO_HOME="/home/livy/.cargo"
    export RUSTUP_HOME="/home/livy/.rustup"
    source /home/livy/.cargo/env
    cargo build --release --bin notary-server
    echo "✅ TLS Notary server built successfully"
    '
  
  # Create systemd service for TLS Notary server
  - |
    sudo -u livy bash -c '
    echo "[Unit]" > /tmp/tls-notary-server.service
    echo "Description=TLS Notary Server" >> /tmp/tls-notary-server.service
    echo "After=network.target" >> /tmp/tls-notary-server.service
    echo "" >> /tmp/tls-notary-server.service
    echo "[Service]" >> /tmp/tls-notary-server.service
    echo "Type=simple" >> /tmp/tls-notary-server.service
    echo "User=livy" >> /tmp/tls-notary-server.service
    echo "Group=livy" >> /tmp/tls-notary-server.service
    echo "WorkingDirectory=/home/livy/tls-notary-config" >> /tmp/tls-notary-server.service
    echo "ExecStart=/home/livy/src/tlsn/target/release/notary-server" >> /tmp/tls-notary-server.service
    echo "Restart=always" >> /tmp/tls-notary-server.service
    echo "RestartSec=5" >> /tmp/tls-notary-server.service
    echo "Environment=PATH=/home/livy/.cargo/bin:/usr/local/bin:/usr/bin:/bin" >> /tmp/tls-notary-server.service
    echo "" >> /tmp/tls-notary-server.service
    echo "[Install]" >> /tmp/tls-notary-server.service
    echo "WantedBy=multi-user.target" >> /tmp/tls-notary-server.service
    sudo mv /tmp/tls-notary-server.service /etc/systemd/system/
    echo "✅ TLS Notary systemd service created"
    '
  
  # Start TLS Notary server service
  - |
    systemctl daemon-reload
    systemctl enable tls-notary-server
    systemctl start tls-notary-server
    echo "✅ TLS Notary server service started"
  
  # Wait a moment for service to start and test it
  - sleep 10
  
  # Test TLS Notary server
  - |
    sudo -u livy bash -c '
    echo "🔧 Testing TLS Notary server..."
    if curl -s http://localhost:7047/healthcheck > /dev/null; then
      echo "✅ TLS Notary server is responding to health checks"
    else
      echo "❌ TLS Notary server health check failed"
    fi
    
    # Show service status
    systemctl status tls-notary-server --no-pager -l
    '

final_message: |
  Infrastructure Ready!