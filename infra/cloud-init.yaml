#cloud-config

packages:
  - curl
  - jq
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - wget

users:
  - name: livy
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

write_files:
  - path: /opt/scripts/core.sh
    permissions: '0755'
    encoding: b64
    content: ${core_script_b64}
  
  - path: /opt/scripts/install.sh
    permissions: '0755'
    encoding: b64
    content: ${install_script_b64}
  
  - path: /opt/scripts/run.sh
    permissions: '0755'
    encoding: b64
    content: ${run_script_b64}

runcmd:
  # Execute the three-phase setup
  - /opt/scripts/core.sh
  - /opt/scripts/install.sh
  - /opt/scripts/run.sh

final_message: |
  Infrastructure Ready!